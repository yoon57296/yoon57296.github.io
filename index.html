<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yoon's room</title>
<meta name="description" content="yoon57296의 방. 드래그해서 둘러보고, 물건을 눌러 이야기를 열어보세요.">
<meta name="theme-color" content="#15120f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one full-screen 3D room; quiet HUD in the corners; content opens as a side sheet (bottom sheet on phones). */
:root{
  color-scheme:dark;
  --ink:#15120f;          /* room shadow */
  --sheet:#1b1714eb;      /* panel glass */
  --paper:#efe8dc;        /* text */
  --muted:#a39a8c;        /* secondary text */
  --line:#3b342c;         /* hairlines */
  --lamp:#f2a65a;         /* desk-lamp amber */
  --serif:"Gowun Batang","Noto Serif KR",Georgia,serif;
  --sans:"IBM Plex Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font:400 15px/1.75 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene.dragging{cursor:grabbing}
#scene.pointing{cursor:pointer}
.film{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,#0b0907 135%)}
.film::after{content:"";position:absolute;inset:0;background-image:var(--grain);opacity:.06;mix-blend-mode:overlay}

/* HUD */
.hud{position:fixed;z-index:5;pointer-events:none;display:flex;gap:8px;align-items:center}
.hud>*{pointer-events:auto}
.hud-tl{top:calc(18px + env(safe-area-inset-top,0px));left:18px}
.hud-tr{top:calc(18px + env(safe-area-inset-top,0px));right:18px}
.hud-bl{bottom:calc(18px + env(safe-area-inset-bottom,0px));left:18px}
.hud-bc{bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);transition:opacity .6s}
.mark{display:flex;flex-direction:column;gap:2px;padding:9px 14px 8px;background:#15120fb8;backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:4px}
.mark b{font:700 19px/1.1 var(--serif);letter-spacing:-.01em}
.mark span{font:400 10.5px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:8px;background:#15120fb8;backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:4px;padding:7px 12px;font:400 12px/1.2 var(--mono);letter-spacing:.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
button.pill:hover{border-color:var(--lamp)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--lamp);box-shadow:0 0 8px var(--lamp)}
.hint{font:400 12px/1.4 var(--mono);letter-spacing:.04em;color:var(--paper);background:#15120f99;backdrop-filter:blur(6px);padding:7px 12px;border-radius:4px;white-space:nowrap}

#tip{position:fixed;z-index:6;pointer-events:none;background:#f4ede1;color:#231c15;padding:6px 10px 7px;border-radius:2px;transform:translate(14px,-120%);box-shadow:0 6px 20px #0006;opacity:0;transition:opacity .15s;max-width:260px}
#tip.on{opacity:1}
#tip b{display:block;font:700 15px/1.25 var(--serif)}
#tip small{display:block;font:400 10.5px/1.4 var(--mono);letter-spacing:.04em;color:#6b5d4c;text-transform:uppercase}

#list{position:fixed;z-index:7;left:18px;bottom:calc(62px + env(safe-area-inset-bottom,0px));width:min(290px,calc(100% - 36px));background:var(--sheet);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:6px;padding:6px}
#list button{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;padding:9px 10px;border-radius:3px;font-size:14px}
#list button:hover{background:#ffffff0d}
#list button span:last-child{font:400 10.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}

/* Panel */
#panel{position:fixed;z-index:8;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--sheet);backdrop-filter:blur(16px);border-left:1px solid var(--line);padding:calc(22px + env(safe-area-inset-top,0px)) 30px calc(30px + env(safe-area-inset-bottom,0px));overflow-y:auto;transform:translateX(102%);transition:transform .55s cubic-bezier(.2,.8,.2,1);visibility:hidden}
#panel.open{transform:none;visibility:visible}
.p-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px}
.back{font:400 11.5px var(--mono);letter-spacing:.04em;color:var(--muted)}
.back:hover{color:var(--paper)}
.p-close{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;font-size:17px;line-height:1;text-align:center}
.p-close:hover{border-color:var(--lamp);color:var(--lamp)}
.kicker{font:400 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--lamp)}
#panel h2{margin:12px 0 16px;font:700 clamp(28px,4.6vw,36px)/1.15 var(--serif);letter-spacing:-.02em;text-wrap:balance}
#panel h3{margin:30px 0 10px;font:500 11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#panel p{margin:0 0 14px;color:#d8d0c3;max-width:60ch}
#panel p strong{color:var(--paper);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font:400 11.5px/1.6 var(--mono);color:var(--muted);margin:-4px 0 18px}
.meta .lang::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c,#888);margin-right:6px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;width:100%;padding:13px 0;border-top:1px solid var(--line);text-decoration:none}
.rows .row:last-child{border-bottom:1px solid var(--line)}
.row>span:first-child{min-width:0}
.row b{font:700 17px/1.35 var(--serif)}
.row small{display:block;font:400 13px/1.5 var(--sans);color:var(--muted);margin-top:2px}
.row .side{font:400 11px var(--mono);color:var(--muted);white-space:nowrap}
button.row:hover b{color:var(--lamp)}
.tag{display:inline-block;font:500 9.5px/1.7 var(--mono);letter-spacing:.06em;color:var(--lamp);border:1px solid #f2a65a66;border-radius:2px;padding:0 5px;margin-left:8px;vertical-align:2px}
.stars{color:var(--lamp);letter-spacing:2px}
.review p{font:400 16px/1.95 var(--serif)!important;color:#e6ddcf!important}
.readme{font:400 12.5px/1.7 var(--mono);color:#cfc6b8;background:#0f0d0b;border:1px solid var(--line);border-radius:4px;padding:14px 16px;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto;margin:0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.cta{display:inline-flex;gap:10px;align-items:center;padding:11px 18px;border-radius:3px;background:var(--lamp);color:var(--ink);font-weight:600;font-size:14px;text-decoration:none}
.cta.ghost{background:none;color:var(--paper);border:1px solid var(--line)}
.cta:hover{filter:brightness(1.08)}.cta.ghost:hover{border-color:var(--lamp)}
.ctrl{display:grid;gap:14px;margin-top:8px}
.big-time{font:700 54px/1 var(--serif);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--lamp)}
.switch{display:flex;align-items:center;gap:10px;font-size:14px;color:#d8d0c3}
.switch input{width:17px;height:17px;accent-color:var(--lamp)}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.seg button{border:1px solid var(--line);border-radius:4px;padding:11px 12px;font-size:14px}
.seg button span{display:block;font:400 10.5px/1.5 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--lamp);background:#f2a65a12}
.seg button[aria-pressed="true"] span{color:var(--lamp)}
.status{font-size:13px;color:var(--muted)}
.note{font:400 13px/1.7 var(--sans);color:var(--muted);border-left:2px solid var(--line);padding-left:12px;margin-top:22px}

#loader{position:fixed;inset:0;z-index:20;background:var(--ink);display:grid;place-items:center;text-align:center;transition:opacity .9s}
#loader.done{opacity:0;pointer-events:none}
#loader b{font:700 30px/1.2 var(--serif)}
#loader span{display:block;margin-top:10px;font:400 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#nogl{display:none;position:fixed;inset:0;z-index:4;place-items:center;text-align:center;padding:24px}
.nogl #nogl{display:grid}

@media (max-width:700px){
  #panel{top:auto;left:0;width:100%;height:62%;border-left:0;border-top:1px solid var(--line);border-radius:12px 12px 0 0;transform:translateY(102%);padding:18px 22px calc(26px + env(safe-area-inset-bottom,0px))}
  .hud-tr .pill.weather{display:none}
  .hud-bc{bottom:calc(66px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){#panel,#loader,.hud-bc{transition:none}}
</style>
</head>
<body>
<canvas id="scene" aria-label="yoon의 방 3D 장면. 드래그해서 둘러보고 물건을 눌러보세요. 키보드 사용자는 왼쪽 아래 물건 목록 버튼을 이용하세요."></canvas>
<div class="film" aria-hidden="true"></div>

<div class="hud hud-tl"><div class="mark"><b>yoon's room</b><span>yoon57296 · Seoul</span></div></div>
<div class="hud hud-tr">
  <button class="pill" id="time-pill" type="button" aria-label="시간 바꾸기"><span class="dot"></span><span id="time-text">--:--</span></button>
  <button class="pill weather" id="weather-pill" type="button" aria-label="날씨 바꾸기"><span id="weather-text">맑음</span></button>
</div>
<div class="hud hud-bl"><button class="pill" id="list-btn" type="button" aria-expanded="false" aria-controls="list">물건 목록</button></div>
<div class="hud hud-bc" id="hint"><div class="hint">드래그해서 둘러보고, 물건을 눌러보세요</div></div>
<div id="list" hidden></div>
<div id="tip" role="presentation"></div>

<aside id="panel" aria-labelledby="panel-title" aria-hidden="true">
  <div class="p-top"><button class="back" id="back" type="button">← 방으로 돌아가기</button><button class="p-close" id="close" type="button" aria-label="닫기">×</button></div>
  <div id="panel-body"></div>
</aside>

<div id="nogl"><div><b style="font:700 26px var(--serif)">yoon's room</b><p class="status">이 브라우저에서는 3D 방을 그릴 수 없어요.<br>왼쪽 아래 '물건 목록'에서 내용을 볼 수 있어요.</p></div></div>
<div id="loader"><div><b>yoon's room</b><span>불 켜는 중</span></div></div>

<template id="tpl-monitor">
  <div class="kicker">Desk · Monitor</div>
  <h2 id="panel-title">지금 만들고 있는 것</h2>
  <p>하루의 대부분을 보내는 자리예요. 지금은 이 방을 만들고 있어요. 물건 하나하나를 코드로 깎고, 빛과 날씨를 붙이는 중이에요.</p>
  <p>완성된 것과 진행 중인 것들은 책상 옆 <strong>프로젝트 책장</strong>에 상자로 꽂혀 있어요.</p>
  <div class="btns"><button class="cta" type="button" data-go="projects">프로젝트 책장 보기</button></div>
</template>
<template id="tpl-console">
  <div class="kicker">TV · Game console</div>
  <h2 id="panel-title">Games</h2>
  <p>쉴 때는 게임을 해요. 잘 만든 게임은 제가 아는 가장 정교한 인터랙션이라, 놀다가도 이건 어떻게 만들었을까 자주 생각해요.</p>
  <p class="note">좋아하는 게임 목록은 곧 채울게요.</p>
</template>
<template id="tpl-guitar">
  <div class="kicker">Guitar</div>
  <h2 id="panel-title">Music</h2>
  <p>코드가 막힐 때 잡는 악기예요. 반복해서 연습하다 보면 어느 순간 손이 먼저 아는 감각이 생기는데, 그게 코딩과 닮았다고 생각해요.</p>
  <p class="note">요즘 연습하는 곡은 곧 적어둘게요.</p>
</template>
<template id="tpl-hobby">
  <div class="kicker">Hobby shelf</div>
  <h2 id="panel-title">Little things</h2>
  <p>필름 카메라, 큐브, 헤드폰. 손으로 만지작거리는 작은 물건들이 머리를 식혀줘요.</p>
  <p class="note">하나씩 이야기를 붙여볼 예정이에요.</p>
</template>
<template id="tpl-door">
  <div class="kicker">Door</div>
  <h2 id="panel-title">Say hello</h2>
  <p>문 밖에서 다시 만나요. 새로운 실험은 GitHub에 가장 먼저 올라와요.</p>
  <div class="btns"><a class="cta" href="https://github.com/yoon57296" target="_blank" rel="noopener">github.com/yoon57296 ↗</a></div>
</template>
<template id="tpl-clock">
  <div class="kicker">Wall clock</div>
  <h2 id="panel-title">지금 몇 시예요?</h2>
  <p>시계를 돌리면 창밖 하늘과 방 안의 빛이 바뀌어요.</p>
  <div class="ctrl">
    <div class="big-time" id="big-time">--:--</div>
    <label for="time-range" class="status">하루 중 시각</label>
    <input type="range" id="time-range" min="0" max="1439" step="5">
    <label class="switch" for="time-live"><input type="checkbox" id="time-live"> 서울의 지금 시각 따라가기</label>
  </div>
</template>
<template id="tpl-window">
  <div class="kicker">Window</div>
  <h2 id="panel-title">창밖 날씨</h2>
  <p>창밖 날씨를 골라보세요. 처음에는 서울의 실제 날씨를 따라가요.</p>
  <div class="ctrl">
    <div class="seg" id="weather-seg">
      <button type="button" data-w="live">실시간<span>Seoul now</span></button>
      <button type="button" data-w="clear">맑음<span>Clear</span></button>
      <button type="button" data-w="cloudy">흐림<span>Cloudy</span></button>
      <button type="button" data-w="rain">비<span>Rain · thunder</span></button>
      <button type="button" data-w="snow">눈<span>Snow</span></button>
    </div>
    <p class="status" id="weather-status"></p>
  </div>
</template>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isPhone = () => innerWidth <= 700;
const clamp01 = v => Math.max(0, Math.min(1, v));
const smooth = (a, b, v) => { const t = clamp01((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const hash = s => { let h = 2166136261; for (const c of String(s)) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return (h >>> 0) / 4294967296; };

// film grain for the CSS overlay
(() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'), d = g.createImageData(128, 128);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); document.documentElement.style.setProperty('--grain', 'url(' + c.toDataURL() + ')'); })();

/* ---------- State ---------- */
const state = { live: true, minutes: 0, weatherMode: 'live', liveWeather: 'clear', liveWeatherOk: false, lamp: null, focus: null };
const seoulMinutes = () => {
  const p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date());
  return (+p.find(x => x.type === 'hour').value % 24) * 60 + +p.find(x => x.type === 'minute').value;
};
state.minutes = seoulMinutes();
const weather = () => state.weatherMode === 'live' ? state.liveWeather : state.weatherMode;
const WEATHER_KO = { clear: '맑음', cloudy: '흐림', rain: '비', snow: '눈' };
const fmtTime = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(Math.floor(m % 60)).padStart(2, '0');
const LANG_COLORS = { JavaScript: '#e8c547', TypeScript: '#3f78c4', Python: '#3d6fa8', HTML: '#d9643a', CSS: '#6b4ea0', Java: '#b07219', 'C++': '#c5466f', C: '#666b73', Go: '#3fb3c9', Rust: '#c06a3e', Kotlin: '#a97bff', Swift: '#f05138', 'Jupyter Notebook': '#da5b0b', Shell: '#89e051' };

/* ---------- Data: projects (GitHub) and books (data/books.json) ---------- */
const data = { repos: null, books: null, reposLive: false };
const THIS_SITE = { name: 'yoon57296.github.io', full_name: 'yoon57296/yoon57296.github.io', description: '지금 보고 있는 이 방. Three.js로 물건 하나하나를 코드로 만들었어요.', language: 'HTML', stargazers_count: 0, html_url: 'https://github.com/yoon57296/yoon57296.github.io', homepage: 'https://yoon57296.github.io', pushed_at: new Date().toISOString() };
const reposReady = fetch('https://api.github.com/users/yoon57296/repos?per_page=100&sort=pushed')
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(list => { data.repos = list.filter(r => !r.fork && !r.archived); data.reposLive = true; })
  .catch(() => { data.repos = []; })
  .then(() => { if (!data.repos.some(r => r.name === THIS_SITE.name)) data.repos.push(THIS_SITE); return data.repos; });
const booksReady = fetch('data/books.json')
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(j => (data.books = j.books || []))
  .catch(() => (data.books = []));

/* ---------- Objects ---------- */
const OBJECTS = {
  reading:  { label: '책장', sub: 'Books & reviews', pos: [-1.45, 1.4, -1.6], look: [-2.85, 1.25, -1.6] },
  projects: { label: '프로젝트 책장', sub: 'GitHub projects', pos: [2.4, 1.35, -1.5], look: [2.42, 1.2, -3.0] },
  monitor:  { label: '모니터', sub: 'Now building', tpl: 'tpl-monitor', pos: [1.0, 1.22, -1.7], look: [1.0, 1.05, -2.8] },
  console:  { label: '게임기', sub: 'Games', tpl: 'tpl-console', pos: [1.3, 1.1, -0.4], look: [2.85, 0.85, -0.4] },
  guitar:   { label: '기타', sub: 'Music', tpl: 'tpl-guitar', pos: [-1.6, 1.0, 0.3], look: [-2.8, 0.72, 0.3] },
  hobby:    { label: '취미 선반', sub: 'Little things', tpl: 'tpl-hobby', pos: [1.55, 1.8, -0.4], look: [2.9, 1.8, -0.4] },
  door:     { label: '방문', sub: 'Contact', tpl: 'tpl-door', pos: [1.45, 1.5, 1.2], look: [1.45, 1.25, 3.0] },
  clock:    { label: '벽시계', sub: 'Change time', tpl: 'tpl-clock', pos: [1.0, 2.05, -1.95], look: [1.0, 2.15, -3.0] },
  window:   { label: '창문', sub: 'Change weather', tpl: 'tpl-window', pos: [-1.0, 1.6, -1.5], look: [-1.0, 1.65, -4.0] },
  lamp:     { label: '스탠드', sub: 'Light on / off' }
};

/* ---------- Panel ---------- */
const panel = $('#panel'), body = $('#panel-body');
const hooks = { onClose: () => {}, onItem: () => {} };
function showPanel(nodes, backLabel, backFn) {
  body.replaceChildren(...nodes);
  $('#back').textContent = backLabel || '← 방으로 돌아가기';
  $('#back').onclick = backFn || closePanel;
  panel.classList.add('open'); panel.setAttribute('aria-hidden', 'false'); panel.scrollTop = 0;
  body.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => activate(b.dataset.go)));
}

  let yaw = innerWidth < innerHeight ? -.35 : 0, pitch = -.07;
  const curPos = home.clone(), curLook = new THREE.Vector3(0, 1.45, -2), goalPos = home.clone(), goalLook = curLook.clone();
  const lookDir = () => new THREE.Vector3(-Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
  const view = { cur: 0, goal: 0 };
  let selected = null, hoverItem = null, darkness = 0;
  const lampOn = () => state.lamp !== null ? state.lamp : darkness > .45;
  function moveTo(key) {
    const o = OBJECTS[key]; state.focus = key; goalLook.set(...o.look); goalPos.set(...o.pos);
    // phones show less of the scene above the bottom sheet, so step back a little
    if (isPhone()) goalPos.sub(goalLook).multiplyScalar(1.6).add(goalLook);
    view.goal = 1; hideHint(); tip.classList.remove('on');
  }

  activate = key => {
    if (key === 'lamp') { state.lamp = !lampOn(); return; }
    moveTo(key); selected = null; openPanel(key);
  };
  hooks.onClose = () => { view.goal = 0; selected = null; };
  hooks.onItem = (kind, i) => { selected = kind ? items.find(it => it.kind === kind && it.index === i) || null : null; };
  openBook = i => { if (state.focus !== 'reading') moveTo('reading'); hooks.onItem('book', i); showBook(i); };
  openRepo = i => { if (state.focus !== 'projects') moveTo('projects'); hooks.onItem('repo', i); showRepo(i); };

  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), tip = $('#tip');
  let hover = null, drag = null;
  function pick(x, y) {
    ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    for (const h of ray.intersectObjects(scene.children, true)) {
      const o = h.object; if (!o.visible || o === sky || o.isLine || o.isPoints) continue;
      const m = o.material; if (m && !Array.isArray(m) && m.depthWrite === false && o !== glass) continue;
      const k = o.userData.key; if (!k) return null;
      const it = o.userData.item ? items.find(i => i.kind === o.userData.item.kind && i.index === o.userData.item.index) : null;
      return { key: k, item: it || null };
    }
    return null;
  }
  function setHover(hit, x, y) {
    const key = hit ? hit.key : null;
    if (key !== hover) { if (hover) setGlow(hover, false); hover = key; if (key) setGlow(key, true); }
    hoverItem = hit && hit.item || null;
    canvas.classList.toggle('pointing', !!key && !drag);
    if (key && (!state.focus || hoverItem)) {
      const o = OBJECTS[key]; tip.replaceChildren(el('b', { textContent: hoverItem ? hoverItem.label : o.label }), el('small', { textContent: hoverItem ? hoverItem.sub : o.sub }));
      tip.style.left = x + 'px'; tip.style.top = y + 'px'; tip.classList.add('on');
    } else tip.classList.remove('on');
  }
  canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, yaw, pitch, moved: false, id: e.pointerId }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e => {
    if (drag && drag.id === e.pointerId) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.hypot(dx, dy) > 6) { drag.moved = true; canvas.classList.add('dragging'); hideHint(); }
      if (drag.moved && !state.focus) { const k = (e.pointerType === 'touch' ? 3.2 : 2.4) / innerWidth; yaw = drag.yaw - dx * k; pitch = Math.max(-.7, Math.min(.55, drag.pitch - dy * k)); }
      if (drag.moved) { setHover(null); return; }
    }
    if (e.pointerType !== 'touch') setHover(pick(e.clientX, e.clientY), e.clientX, e.clientY);
  });
  canvas.addEventListener('pointerup', e => {
    canvas.classList.remove('dragging');
    if (drag && !drag.moved) {
      const hit = pick(e.clientX, e.clientY);
      if (hit && hit.item) (hit.item.kind === 'book' ? openBook : openRepo)(hit.item.index);
      else if (hit) { if (hit.key === 'lamp' || hit.key !== state.focus) activate(hit.key); }
      else if (state.focus) closePanel();
    }
    drag = null;
  });
  canvas.addEventListener('pointercancel', () => { drag = null; canvas.classList.remove('dragging'); });
  canvas.addEventListener('pointerleave', () => { if (!drag) setHover(null); });
  addEventListener('keydown', e => {
    if (state.focus || (e.target.closest && e.target.closest('input,button,a'))) return;
    if (e.key === 'ArrowLeft') yaw += .12; if (e.key === 'ArrowRight') yaw -= .12;
    if (e.key === 'ArrowUp') pitch = Math.min(.55, pitch + .08); if (e.key === 'ArrowDown') pitch = Math.max(-.7, pitch - .08);
  });
  const hintTimer = setTimeout(hideHint, 9000);
  function hideHint() { clearTimeout(hintTimer); $('#hint').style.opacity = 0; }

  /* ===== time & weather → light ===== */
  const KEYS = [ // hour, sky top, sky bottom, light colour, light intensity, hemisphere
    [0, '#05081a', '#111a36', '#7f97ff', .3, .1], [4.5, '#070c22', '#1a2146', '#8098ff', .26, .1],
    [6, '#2c3d78', '#e9967a', '#ffb07a', 1.0, .24], [8, '#4b86d8', '#bfe0ff', '#fff0d8', 2.8, .48],
    [16, '#4b86d8', '#cfe6ff', '#fff3e0', 2.8, .48], [18, '#43558f', '#f7a26b', '#ff9a5c', 1.8, .3],
    [19.5, '#141c3f', '#3d3562', '#8b8cff', .4, .14], [24, '#05081a', '#111a36', '#7f97ff', .3, .1]];
  const cA = new THREE.Color(), cB = new THREE.Color();
  function sample(h) {
    let i = 0; while (h > KEYS[i + 1][0]) i++;
    const a = KEYS[i], b = KEYS[i + 1], t = smooth(a[0], b[0], h), mix = (x, y) => cA.set(x).lerp(cB.set(y), t).clone();
    return { top: mix(a[1], b[1]), bottom: mix(a[2], b[2]), light: mix(a[3], b[3]), li: a[4] + (b[4] - a[4]) * t, hemi: a[5] + (b[5] - a[5]) * t };
  }
  const W = { clear: { gray: 0, dim: 1, cloud: .15 }, cloudy: { gray: .7, dim: .35, cloud: .9 }, rain: { gray: .8, dim: .25, cloud: 1 }, snow: { gray: .55, dim: .5, cloud: .8 } };
  const wv = { gray: 0, dim: 1, cloud: .15, rain: 0, snow: 0 };
  let flash = 0, nextFlash = 8;
  function applyEnvironment(dt, t) {
    const h = state.minutes / 60, s = sample(h), w = weather(), target = W[w], k = 1 - Math.exp(-dt * 2.5);
    for (const key of ['gray', 'dim', 'cloud']) wv[key] += (target[key] - wv[key]) * k;
    wv.rain += ((w === 'rain' ? 1 : 0) - wv.rain) * k; wv.snow += ((w === 'snow' ? 1 : 0) - wv.snow) * k;
    const day = smooth(5, 8, h) * (1 - smooth(17.5, 20, h));
    darkness = 1 - day * (.5 + .5 * wv.dim);
    const gray = new THREE.Color('#15171d').lerp(cA.set('#8c939c'), day);
    skyU.top.value.copy(s.top).lerp(gray, wv.gray); skyU.bottom.value.copy(s.bottom).lerp(gray, wv.gray * .9);
    if (wv.rain > .3 && !reduceMotion) { nextFlash -= dt; if (nextFlash < 0) { flash = 1; nextFlash = 7 + Math.random() * 12; } }
    flash = Math.max(0, flash - dt * 4);
    const fl = flash > .5 || (flash > .1 && flash < .25) ? flash : 0;
    skyU.top.value.lerp(cA.set('#dfe6ff'), fl * .8); skyU.bottom.value.lerp(cA.set('#dfe6ff'), fl * .6);
    skyLight.color.copy(s.light).lerp(cA.set('#c9d2e0'), wv.gray * .6);
    skyLight.intensity = s.li * wv.dim + fl * 2;
    hemi.intensity = s.hemi * (.55 + .45 * wv.dim) + fl * .4; hemi.color.copy(s.top).lerp(cA.set('#ffffff'), .6);
    const isDay = h >= 5.5 && h < 19.5, p = isDay ? (h - 5.5) / 14 : ((h + 24 - 19.5) % 24) / 10;
    disc.position.set(-4.2 + p * 6.4, 1.2 + Math.sin(p * Math.PI) * 3.2, -9.6); halo.position.copy(disc.position); halo.position.z += .01;
    disc.material.color.set(isDay ? (h < 7.5 || h > 17 ? '#ffb27a' : '#fff6dc') : '#e8eeff'); disc.scale.setScalar(isDay ? 1 : .6); halo.scale.setScalar(isDay ? 1 : .6);
    disc.material.opacity = clamp01(1 - wv.cloud * 1.1) * (isDay ? 1 : .9); halo.material.opacity = disc.material.opacity * .8;
    starPts.material.opacity = (1 - day) * (1 - wv.cloud) * .9;
    clouds.forEach(c => { c.material.opacity = wv.cloud * .85; c.material.color.copy(gray).lerp(cA.set('#ffffff'), day * (1 - wv.gray * .5)); if (!reduceMotion) c.position.x += c.userData.speed * dt; if (c.position.x > 6) c.position.x = -10; });
    litMats.forEach(m => m.opacity = smooth(.25, .8, darkness));
    cityBody.color.set('#2b3038').lerp(cA.set('#7d8796'), day * .6);
    rain.visible = wv.rain > .02; rain.material.opacity = .5 * wv.rain;
    if (rain.visible && !reduceMotion) { const a = rainGeo.attributes.position.array; for (let i = 0; i < a.length; i += 6) { a[i + 1] -= dt * 9; a[i + 4] -= dt * 9; if (a[i + 4] < -1) { a[i + 1] += 6; a[i + 4] += 6; } } rainGeo.attributes.position.needsUpdate = true; }
    snow.visible = wv.snow > .02; snow.material.opacity = .9 * wv.snow;
    if (snow.visible && !reduceMotion) { const a = snowGeo.attributes.position.array; for (let i = 0; i < a.length; i += 3) { a[i + 1] -= dt * .7; a[i] += Math.sin(t + i) * dt * .15; if (a[i + 1] < -1) a[i + 1] += 6; } snowGeo.attributes.position.needsUpdate = true; }
    const on = lampOn();
    lampLight.intensity += ((on ? 2.6 : 0) - lampLight.intensity) * Math.min(1, k * 2); lampGlow.intensity = lampLight.intensity * .3;
    bulb.material.color.set(on ? '#fff1d6' : '#6b6358');
    const fairyOn = smooth(.35, .7, darkness);
    fairyLight.intensity = fairyOn * .9; fairyMat.color.set(fairyOn > .1 ? '#ffd59a' : '#8a7a62');
    fairyGlows.forEach(g => { g.visible = fairyOn > .02; }); glowMat.opacity = fairyOn * (.85 + Math.sin(t * 1.3) * .08);
    renderer.toneMappingExposure = 1.0 + darkness * .1;
    const sec = state.live ? new Date().getSeconds() : 0, mm = state.minutes + sec / 60;
    hourHand.rotation.z = -((mm / 60) % 12) / 12 * Math.PI * 2; minHand.rotation.z = -(mm % 60) / 60 * Math.PI * 2; secHand.rotation.z = -sec / 60 * Math.PI * 2;
  }

  /* ===== loop ===== */
  function resize() {
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight; camera.fov = innerWidth < innerHeight ? 76 : 66; camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();
  let last = performance.now(), blinkT = 0, tvT = 0, first = true;
  function frame(now) {
    // rAF time can precede the first performance.now(), so never let dt go negative
    const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; const t = now / 1000;
    if (!state.focus) { goalPos.copy(home); goalLook.copy(home).add(lookDir().multiplyScalar(3)); }
    const k = reduceMotion ? 1 : 1 - Math.exp(-dt * 3.2);
    curPos.lerp(goalPos, k); curLook.lerp(goalLook, k); camera.position.copy(curPos); camera.lookAt(curLook);
    view.cur += (view.goal - view.cur) * k;
    if (view.cur > .001) { const W_ = innerWidth, H_ = innerHeight; camera.setViewOffset(W_, H_, isPhone() ? 0 : Math.min(460, W_) / 2 * view.cur, isPhone() ? H_ * .62 / 2 * view.cur : 0, W_, H_); }
    else camera.clearViewOffset();
    const ki = reduceMotion ? 1 : 1 - Math.exp(-dt * 10);
    items.forEach(it => it.mesh.position.lerp(it === selected || it === hoverItem ? it.out : it.home, ki));
    blinkT += dt; if (blinkT > .55) { blinkT = 0; drawScreen(Math.floor(t / .55) % 2 === 0); }
    tvT += dt; if (tvT > .1 && !reduceMotion) { tvT = 0; drawTV(t); }
    tvGlow.intensity = .28 + Math.sin(t * 3) * .05;
    applyEnvironment(dt, t);
    renderer.render(scene, camera);
    if (first) { first = false; setTimeout(() => $('#loader').classList.add('done'), 200); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
