<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yoon's room</title>
<meta name="description" content="yoon57296의 방. 드래그해서 둘러보고, 물건을 눌러 이야기를 열어보세요.">
<meta name="theme-color" content="#14110f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Gaegu:wght@400;700&family=Gothic+A1:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one full-screen 3D room; HUD in the corners; content opens as a side sheet (bottom sheet on phones). */
:root{
  color-scheme:dark;
  --ink:#14110f;          /* room shadow */
  --sheet:#1d1916f0;      /* panel glass */
  --paper:#f1ebe1;        /* text */
  --muted:#a89f92;        /* secondary text */
  --line:#3a332c;         /* hairlines */
  --lamp:#ffb45c;         /* desk-lamp amber accent */
  --display:"Bricolage Grotesque","Gothic A1",system-ui,sans-serif;
  --body:"Gothic A1",system-ui,sans-serif;
  --hand:"Gaegu","Gothic A1",cursive;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font:400 15px/1.7 var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene.dragging{cursor:grabbing}
#scene.pointing{cursor:pointer}

/* HUD */
.hud{position:fixed;z-index:5;pointer-events:none;display:flex;gap:10px;align-items:center}
.hud>*{pointer-events:auto}
.hud-tl{top:calc(16px + env(safe-area-inset-top,0px));left:16px;flex-direction:column;align-items:flex-start;gap:0;background:#14110fb3;backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:8px 14px 6px}
.hud-tr{top:calc(16px + env(safe-area-inset-top,0px));right:16px}
.hud-bl{bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px}
.hud-bc{bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);transition:opacity .4s}
.name{font:700 22px/1 var(--display);letter-spacing:-.02em;text-shadow:0 1px 12px #0008}
.name span{color:var(--lamp)}
.sub{font:400 17px/1.4 var(--hand);color:var(--muted);text-shadow:0 1px 8px #000a}
.pill{display:inline-flex;align-items:center;gap:8px;background:#14110fb3;backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
button.pill:hover{border-color:var(--lamp)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--lamp);box-shadow:0 0 8px var(--lamp)}
.hint{font:400 19px/1.3 var(--hand);color:var(--paper);text-shadow:0 1px 10px #000;text-align:center;white-space:nowrap}

/* Tooltip */
#tip{position:fixed;z-index:6;pointer-events:none;background:#fff6e4;color:#2a2219;font:700 18px/1.2 var(--hand);padding:5px 10px 6px;border-radius:3px;transform:translate(14px,-120%) rotate(-2deg);box-shadow:2px 3px 0 #0004;opacity:0;transition:opacity .15s}
#tip.on{opacity:1}
#tip small{display:block;font-weight:400;font-size:14px;color:#6b5a45}

/* Object list */
#list{position:fixed;z-index:7;left:16px;bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(280px,calc(100% - 32px));background:var(--sheet);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:10px;padding:8px}
#list button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:8px 10px;border-radius:6px;font-size:14px}
#list button:hover{background:#ffffff10}
#list button span:last-child{color:var(--muted);font-size:12px}

/* Panel */
#panel{position:fixed;z-index:8;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--sheet);backdrop-filter:blur(14px);border-left:1px solid var(--line);padding:calc(24px + env(safe-area-inset-top,0px)) 28px calc(28px + env(safe-area-inset-bottom,0px));overflow-y:auto;transform:translateX(102%);transition:transform .5s cubic-bezier(.2,.8,.2,1);visibility:hidden}
#panel.open{transform:none;visibility:visible}
.p-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.back{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.back:hover{color:var(--paper)}
.p-close{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;font-size:18px;line-height:1}
.p-close:hover{border-color:var(--lamp);color:var(--lamp)}
.p-kicker{font:400 19px/1 var(--hand);color:var(--lamp)}
#panel h2{margin:6px 0 16px;font:700 clamp(30px,5vw,40px)/1.05 var(--display);letter-spacing:-.03em;text-wrap:balance}
#panel h3{margin:28px 0 10px;font:500 12px/1.4 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#panel p{margin:0 0 14px;color:#d9d1c4;max-width:60ch}
#panel p strong{color:var(--paper);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}
.item{display:block;padding:12px 0;border-top:1px solid var(--line);text-decoration:none}
.item:last-child{border-bottom:1px solid var(--line)}
.item b{display:flex;justify-content:space-between;gap:12px;font:500 17px/1.3 var(--display)}
.item b em{font:400 11px/1.9 var(--body);font-style:normal;letter-spacing:.06em;color:var(--lamp);border:1px solid #ffb45c55;border-radius:4px;padding:0 6px;height:fit-content;white-space:nowrap}
.item span{display:block;color:var(--muted);font-size:13px;margin-top:3px}
a.item:hover b{color:var(--lamp)}
.note{font:400 18px/1.4 var(--hand);color:var(--muted);transform:rotate(-1deg);margin-top:20px}
.cta{display:inline-flex;gap:10px;align-items:center;margin-top:8px;padding:12px 20px;border-radius:999px;background:var(--lamp);color:var(--ink);font-weight:700;text-decoration:none}
.cta:hover{filter:brightness(1.08)}
.ctrl{display:grid;gap:14px;margin-top:8px}
.big-time{font:700 56px/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--lamp)}
.switch{display:flex;align-items:center;gap:10px;font-size:14px;color:#d9d1c4}
.switch input{width:18px;height:18px;accent-color:var(--lamp)}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.seg button{border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;font-size:14px}
.seg button span{display:block;font:400 17px/1.2 var(--hand);color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--lamp);background:#ffb45c14}
.seg button[aria-pressed="true"] span{color:var(--lamp)}
.status{font-size:13px;color:var(--muted)}

/* Loader */
#loader{position:fixed;inset:0;z-index:20;background:var(--ink);display:grid;place-items:center;text-align:center;transition:opacity .8s}
#loader.done{opacity:0;pointer-events:none}
#loader .name{font-size:34px}
#loader .sub{margin-top:8px}
#nogl{display:none;position:fixed;inset:0;z-index:4;place-items:center;text-align:center;padding:24px}
.nogl #nogl{display:grid}

@media (max-width:700px){
  #panel{top:auto;left:0;width:100%;height:62%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(102%);padding-top:20px}
  .hud-tr .pill.weather{display:none}
  .hint{font-size:17px}
  .hud-bc{bottom:calc(68px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){#panel,#loader,.hud-bc{transition:none}}
</style>
</head>
<body>
<canvas id="scene" aria-label="yoon의 방 3D 장면. 드래그해서 둘러보고 물건을 눌러보세요. 키보드 사용자는 왼쪽 아래 물건 목록 버튼을 이용하세요."></canvas>

<div class="hud hud-tl"><div class="name">yoon<span>'</span>s room</div><div class="sub">yoon57296 · 서울</div></div>
<div class="hud hud-tr">
  <button class="pill" id="time-pill" type="button" aria-label="시간 바꾸기"><span class="dot"></span><span id="time-text">--:--</span></button>
  <button class="pill weather" id="weather-pill" type="button" aria-label="날씨 바꾸기"><span id="weather-text">맑음</span></button>
</div>
<div class="hud hud-bl"><button class="pill" id="list-btn" type="button" aria-expanded="false" aria-controls="list">물건 목록</button></div>
<div class="hud hud-bc" id="hint"><div class="hint">드래그해서 둘러보고, 물건을 눌러보세요</div></div>
<div id="list" hidden></div>
<div id="tip" role="presentation"></div>

<aside id="panel" aria-labelledby="panel-title" aria-hidden="true">
  <div class="p-top"><button class="back" id="back" type="button">← 방으로 돌아가기</button><button class="p-close" id="close" type="button" aria-label="닫기">×</button></div>
  <div id="panel-body"></div>
</aside>

<div id="nogl"><div><div class="name">yoon<span>'</span>s room</div><p class="sub">이 브라우저에서는 3D 방을 그릴 수 없어요.<br>왼쪽 아래 '물건 목록'에서 내용을 볼 수 있어요.</p></div></div>
<div id="loader"><div><div class="name">yoon<span>'</span>s room</div><div class="sub">불 켜는 중…</div></div></div>

<template id="tpl-monitor">
  <div class="p-kicker">책상 위 모니터</div>
  <h2 id="panel-title">Projects</h2>
  <p>하루의 대부분을 보내는 자리예요. 지금 만들고 있는 것들은 GitHub에서 바로 불러와요.</p>
  <h3>On GitHub now</h3>
  <p class="status" id="repo-status">저장소를 불러오는 중…</p>
  <div id="repo-list"></div>
  <h3>Concept demos</h3>
  <div class="item"><b>Neural Field <em>DEMO</em></b><span>보이지 않는 AI의 연결을 눈에 보이는 형태로 설명하는 실험.</span></div>
  <div class="item"><b>System Flow <em>DEMO</em></b><span>복잡한 시스템 구조를 Input → Process → Output 흐름으로 정리하는 실험.</span></div>
  <div class="item"><b>This room <em>LIVE</em></b><span>지금 보고 있는 이 방. Three.js로 물건 하나하나를 코드로 만들었어요.</span></div>
</template>
<template id="tpl-bookshelf">
  <div class="p-kicker">책장</div>
  <h2 id="panel-title">About yoon</h2>
  <p>하나의 분야보다 <strong>하나의 질문</strong>에서 시작해요. 디자인에서 코드로, 코드에서 AI와 시스템으로, 질문이 이끄는 곳으로 가요.</p>
  <p>완벽한 계획보다 <strong>작게 만들어 보는 것</strong>을 좋아해요. 만들고, 부수고, 다시 만들면서 다음 질문을 찾아요.</p>
  <h3>책장에 꽂힌 관심사</h3>
  <div class="chips"><span>Design</span><span>Code</span><span>AI / ML</span><span>Systems</span><span>Interaction</span><span>3D</span></div>
  <p class="note">책장은 아직 채우는 중이에요.</p>
</template>
<template id="tpl-console">
  <div class="p-kicker">게임기</div>
  <h2 id="panel-title">Games</h2>
  <p>쉴 때는 게임을 해요. 잘 만든 게임은 제가 아는 가장 정교한 인터랙션이라, 놀다가도 "이건 어떻게 만들었지?"를 자주 생각해요.</p>
  <p class="note">좋아하는 게임 목록은 곧 채울게요.</p>
</template>
<template id="tpl-guitar">
  <div class="p-kicker">벽에 기대 둔 기타</div>
  <h2 id="panel-title">Music</h2>
  <p>코드가 막힐 때 잡는 악기예요. 반복해서 연습하면 어느 순간 손이 먼저 아는 감각이, 코딩과 닮았다고 생각해요.</p>
  <p class="note">요즘 연습하는 곡은 곧 적어둘게요.</p>
</template>
<template id="tpl-shelf">
  <div class="p-kicker">취미 선반</div>
  <h2 id="panel-title">Little things</h2>
  <p>필름 카메라, 큐브, 헤드폰. 손으로 만지작거리는 작은 물건들이 머리를 식혀줘요.</p>
  <p class="note">하나씩 이야기를 붙여볼 예정이에요.</p>
</template>
<template id="tpl-door">
  <div class="p-kicker">방문</div>
  <h2 id="panel-title">Say hello</h2>
  <p>문 밖에서 다시 만나요. 새로운 실험은 GitHub에 가장 먼저 올라와요.</p>
  <a class="cta" href="https://github.com/yoon57296" target="_blank" rel="noopener">github.com/yoon57296 ↗</a>
</template>
<template id="tpl-clock">
  <div class="p-kicker">벽시계</div>
  <h2 id="panel-title">What time is it?</h2>
  <p>시계를 돌리면 창밖 하늘과 방 안의 빛이 바뀌어요.</p>
  <div class="ctrl">
    <div class="big-time" id="big-time">--:--</div>
    <label for="time-range" class="status">하루 중 시각</label>
    <input type="range" id="time-range" min="0" max="1439" step="5">
    <label class="switch" for="time-live"><input type="checkbox" id="time-live"> 서울의 지금 시각 따라가기</label>
  </div>
</template>
<template id="tpl-window">
  <div class="p-kicker">창문</div>
  <h2 id="panel-title">Weather outside</h2>
  <p>창밖 날씨를 골라보세요. 처음에는 서울의 실제 날씨를 따라가요.</p>
  <div class="ctrl">
    <div class="seg" id="weather-seg">
      <button type="button" data-w="live">실시간<span>서울 날씨</span></button>
      <button type="button" data-w="clear">맑음<span>쨍한 하늘</span></button>
      <button type="button" data-w="cloudy">흐림<span>구름 잔뜩</span></button>
      <button type="button" data-w="rain">비<span>가끔 번개</span></button>
      <button type="button" data-w="snow">눈<span>소복소복</span></button>
    </div>
    <p class="status" id="weather-status"></p>
  </div>
</template>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isPhone = () => innerWidth <= 700;
const clamp01 = v => Math.max(0, Math.min(1, v));
const smooth = (a, b, v) => { const t = clamp01((v - a) / (b - a)); return t * t * (3 - 2 * t); };

/* ---------- State ---------- */
const state = {
  live: true, minutes: 0,            // time of day
  weatherMode: 'live', liveWeather: 'clear', liveWeatherOk: false,
  lamp: null,                        // null = automatic
  focus: null
};
const seoulMinutes = () => {
  const p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date());
  return (+p.find(x => x.type === 'hour').value % 24) * 60 + +p.find(x => x.type === 'minute').value;
};
state.minutes = seoulMinutes();
const weather = () => state.weatherMode === 'live' ? state.liveWeather : state.weatherMode;
const WEATHER_KO = { clear: '맑음', cloudy: '흐림', rain: '비', snow: '눈' };
const fmtTime = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(Math.floor(m % 60)).padStart(2, '0');

/* ---------- Objects / content (also used without WebGL) ---------- */
const OBJECTS = {
  monitor:   { label: '모니터', sub: '프로젝트', tpl: 'tpl-monitor', pos: [1.0, 1.22, -1.7], look: [1.0, 1.05, -2.8] },
  bookshelf: { label: '책장', sub: '나에 대해', tpl: 'tpl-bookshelf', pos: [-1.5, 1.3, -1.2], look: [-2.85, 1.05, -1.2] },
  console:   { label: '게임기', sub: '게임', tpl: 'tpl-console', pos: [1.3, 1.1, -0.4], look: [2.85, 0.85, -0.4] },
  guitar:    { label: '기타', sub: '음악', tpl: 'tpl-guitar', pos: [-1.55, 1.05, 0.35], look: [-2.8, 0.75, 0.35] },
  shelf:     { label: '취미 선반', sub: '작은 물건들', tpl: 'tpl-shelf', pos: [1.55, 1.8, -0.4], look: [2.9, 1.8, -0.4] },
  door:      { label: '방문', sub: '연락하기', tpl: 'tpl-door', pos: [1.45, 1.5, 1.2], look: [1.45, 1.25, 3.0] },
  clock:     { label: '벽시계', sub: '시간 바꾸기', tpl: 'tpl-clock', pos: [2.0, 1.85, -1.9], look: [2.3, 1.9, -3.0] },
  window:    { label: '창문', sub: '날씨 바꾸기', tpl: 'tpl-window', pos: [-1.0, 1.6, -1.5], look: [-1.0, 1.65, -4.0] },
  lamp:      { label: '스탠드', sub: '불 켜고 끄기' }
};

/* ---------- Panel ---------- */
const panel = $('#panel'), body = $('#panel-body');
function openPanel(key) {
  const o = OBJECTS[key];
  body.replaceChildren($('#' + o.tpl).content.cloneNode(true));
  panel.classList.add('open'); panel.setAttribute('aria-hidden', 'false');
  if (key === 'monitor') loadRepos();
  if (key === 'clock') bindClock();
  if (key === 'window') bindWeather();
  setTimeout(() => $('#back').focus({ preventScroll: true }), 50);
}
function closePanel() {
  panel.classList.remove('open'); panel.setAttribute('aria-hidden', 'true');
  state.focus = null; viewShift.goal = 0;
}
$('#back').addEventListener('click', closePanel);
$('#close').addEventListener('click', closePanel);
addEventListener('keydown', e => { if (e.key === 'Escape') { closePanel(); toggleList(false); } });

let repoCache = null;
function loadRepos() {
  const status = $('#repo-status'), list = $('#repo-list');
  const render = repos => {
    const items = repos.filter(r => !r.fork && !r.archived && r.name !== 'yoon57296.github.io').slice(0, 6);
    if (!items.length) { status.textContent = '아직 공개 저장소가 없어요. 새 저장소가 생기면 여기에 자동으로 나타나요.'; return; }
    status.hidden = true;
    items.forEach(r => {
      const a = document.createElement('a'); a.className = 'item'; a.href = r.html_url; a.target = '_blank'; a.rel = 'noopener';
      const b = document.createElement('b'); b.textContent = r.name;
      const s = document.createElement('span'); s.textContent = (r.description || 'GitHub에서 보기') + (r.language ? ' · ' + r.language : '');
      a.append(b, s); list.append(a);
    });
  };
  if (repoCache) return render(repoCache);
  fetch('https://api.github.com/users/yoon57296/repos?per_page=100&sort=updated')
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(j => { repoCache = j; render(j); })
    .catch(() => { status.textContent = 'GitHub 목록을 불러오지 못했어요. github.com/yoon57296 에서 직접 볼 수 있어요.'; });
}
function bindClock() {
  const range = $('#time-range'), live = $('#time-live');
  range.value = Math.round(state.minutes); live.checked = state.live;
  range.addEventListener('input', () => { state.live = false; live.checked = false; state.minutes = +range.value; updateHud(); });
  live.addEventListener('change', () => { state.live = live.checked; if (state.live) state.minutes = seoulMinutes(); range.value = Math.round(state.minutes); updateHud(); });
}
function bindWeather() {
  const seg = $('#weather-seg');
  const sync = () => {
    [...seg.children].forEach(b => b.setAttribute('aria-pressed', String(b.dataset.w === state.weatherMode)));

    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight;
    camera.fov = innerWidth < innerHeight ? 78 : 68;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();

  let last = performance.now(), blinkT = 0, tvT = 0, first = true;
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    const t = now / 1000;
    if (!state.focus) { goalPos.copy(home); goalLook.copy(home).add(lookDir().multiplyScalar(3)); }
    const k = reduceMotion ? 1 : 1 - Math.exp(-dt * 3.2);
    curPos.lerp(goalPos, k); curLook.lerp(goalLook, k);
    camera.position.copy(curPos); camera.lookAt(curLook);
    viewShift.cur += (viewShift.goal - viewShift.cur) * k;
    const W_ = innerWidth, H_ = innerHeight;
    if (viewShift.cur > .001) {
      const px = isPhone() ? 0 : Math.min(440, W_) / 2 * viewShift.cur, py = isPhone() ? H_ * .62 / 2 * viewShift.cur : 0;
      camera.setViewOffset(W_, H_, px, py, W_, H_);
    } else camera.clearViewOffset();
    blinkT += dt; if (blinkT > .55) { blinkT = 0; drawScreen(Math.floor(t / .55) % 2 === 0); }
    tvT += dt; if (tvT > .1 && !reduceMotion) { tvT = 0; drawTV(t); }
    tvGlow.intensity = .3 + Math.sin(t * 3) * .05;
    applyEnvironment(dt, t);
    renderer.render(scene, camera);
    if (first) { first = false; setTimeout(() => $('#loader').classList.add('done'), 150); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
</script>
